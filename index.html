<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Flex Smart Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: draft board left (roll → lineup → log), squad prefs right; stacks on phones */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#e5eaf0; --line:#d2d9e2;
  --fg:#131a23; --muted:#5a6676;
  --accent:#0d7480; --accent-ink:#ffffff; --gold:#9a6a0c;
  --good:#2b8046; --amber:#c4960a; --warn:#c2580c; --bad:#b8392b;
  --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1218; --surface:#141b24; --surface-2:#1b2430; --line:#26313f;
  --fg:#e5eaf0; --muted:#8a96a6;
  --accent:#3fc2c8; --accent-ink:#06191b; --gold:#e1b04a;
  --good:#53c072; --amber:#e9c84a; --warn:#f08a3c; --bad:#ef6b5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1218; --surface:#141b24; --surface-2:#1b2430; --line:#26313f;
  --fg:#e5eaf0; --muted:#8a96a6;
  --accent:#3fc2c8; --accent-ink:#06191b; --gold:#e1b04a;
  --good:#53c072; --amber:#e9c84a; --warn:#f08a3c; --bad:#ef6b5c; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:1.9rem;font-weight:700;line-height:1.1}
h2{font-size:1.15rem;font-weight:600}
.eyebrow{font:500 .72rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:20px}
header.top p{margin:6px 0 0;max-width:60ch;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:8px;font:500 .78rem var(--mono);color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:6px 10px;border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)} .dot.loc{background:var(--warn)}

.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:var(--display);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.win{border-color:var(--good);color:var(--good);background:transparent}
.btn.loss{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.win.sel{background:var(--good);color:var(--surface)}
.btn.loss.sel{background:var(--bad);color:var(--surface)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;display:inline-flex;align-items:center;gap:8px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.mono-av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 .8rem var(--display);background:var(--surface-2);color:var(--fg);flex:none}
.chip[aria-pressed="true"] .mono-av{background:var(--accent);color:var(--accent-ink)}

.glyph{width:22px;height:22px;flex:none;color:var(--fg)}
.slot .role .glyph{color:var(--gold)}

/* lineup */
.lineup{display:flex;flex-direction:column;gap:8px}
.slot{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:left;width:100%}
.slot.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.slot .role{display:flex;align-items:center;gap:8px;font:600 1rem var(--display);text-transform:uppercase;letter-spacing:.06em;min-width:96px}
.slot .who{font-weight:600;font-size:1.02rem;min-width:0;overflow-wrap:anywhere}
.reasons{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:480px){.slot{grid-template-columns:minmax(0,1fr) auto}.slot .role{grid-column:1/3}.reasons{grid-column:1/3}}
.tag{font:500 .74rem/1.2 var(--mono);padding:3px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.tag.good{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.tag.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.tag.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.pick{font:600 .78rem var(--mono);padding:4px 8px;border-radius:5px;white-space:nowrap}
.p0{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.p1{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.p2{color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)}
.p3{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.p4{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:20px;color:var(--muted);text-align:center}
.note{font-size:.85rem;color:var(--muted)}
.notice{padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));font-size:.9rem}

/* games */
.games{display:flex;flex-direction:column;gap:6px}
.game{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 12px;border-radius:8px;border:1px solid var(--line)}
.game.pending{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 8%,transparent)}
.game .when{font:500 .78rem var(--mono);color:var(--muted);white-space:nowrap}
.game .lu{font-size:.88rem;min-width:0;overflow-wrap:anywhere}
.game .lu b{font-weight:600}
.res{font:700 .8rem var(--mono);padding:3px 8px;border-radius:5px}
.res.win{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.res.loss{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
@media (max-width:480px){.game{grid-template-columns:minmax(0,1fr) auto}.game .lu{grid-column:1/3;grid-row:2}}

/* squad */
.players{display:flex;flex-direction:column;gap:12px}
.pcard{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.pcard-head{display:flex;gap:10px;align-items:center}
.pcard-head input{flex:1;min-width:0;font:600 1rem var(--body);color:var(--fg);background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px}
.pcard-head input:hover,.pcard-head input:focus{border-color:var(--line);background:var(--surface)}
.prefs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.pref{display:grid;grid-template-columns:14px 22px 22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 6px;border-radius:6px;background:var(--surface)}
.pref .n{font:600 .8rem var(--mono);color:var(--muted);text-align:center}
.bubbles{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px;position:relative;user-select:none;-webkit-user-select:none}
.bubble{position:relative;display:flex;width:13rem;max-width:100%;align-items:center;gap:6px;padding:5px 4px 5px 5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);cursor:grab;touch-action:none;font-weight:600;font-size:.9rem;transition:box-shadow .15s ease,border-color .15s ease,scale .15s ease}
.bubble:hover{border-color:var(--accent)}
.bubble .glyph{width:18px;height:18px}
.bubble .nm{flex:1;min-width:0}
.bubble .rk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 .74rem var(--mono)}
.rk.r0{background:var(--good);color:var(--surface)} .rk.r1{background:var(--accent);color:var(--accent-ink)}
.rk.r2{background:var(--amber);color:#1d1600} .rk.r3{background:var(--warn);color:var(--surface)} .rk.r4{background:var(--bad);color:var(--surface)}
.bubble.lifted{z-index:3;cursor:grabbing;scale:1.07;border-color:var(--accent);box-shadow:0 10px 24px color-mix(in srgb,var(--fg) 22%,transparent);transition:none}
.bubble:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bubbles-hint{margin:6px 0 0;font-size:.8rem;color:var(--muted)}
.pref .ctl{display:flex;gap:2px}
.icon-btn{border:1px solid transparent;background:transparent;border-radius:5px;width:28px;height:26px;display:grid;place-items:center;color:var(--muted);font-size:.85rem}
.icon-btn:hover{border-color:var(--line);color:var(--fg)}
.icon-btn.on{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.icon-btn:disabled{opacity:.3;cursor:default}
.meter{display:flex;align-items:center;gap:8px;font:500 .75rem var(--mono);color:var(--muted)}
.meter .bar{flex:1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.meter .fill{height:100%;background:var(--gold)}
.add{display:flex;gap:8px}
.add input,.field{flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}

/* heatmap */
.tablewrap{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:3px;width:100%;font-variant-numeric:tabular-nums}
.heat th{font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px}
.heat th.pl{text-align:left;font:600 .9rem var(--body);letter-spacing:0;text-transform:none;color:var(--fg);white-space:nowrap}
.heat td{text-align:center;padding:7px 4px;border-radius:5px;font:500 .85rem var(--mono)}
.heat td.stat{color:var(--muted)}

details.tune summary{cursor:pointer;font:600 .95rem var(--display);letter-spacing:.02em}
.sliders{display:grid;gap:14px;margin-top:12px}
.slider label{display:flex;justify-content:space-between;font-weight:500;font-size:.9rem}
.slider input{width:100%;accent-color:var(--accent)}
.slider p{margin:2px 0 0;font-size:.8rem;color:var(--muted)}
.panel.danger{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.known{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.known b{font-weight:600}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem}
@media (prefers-reduced-motion: no-preference){.slot{animation:drop .28s ease both}.slot:nth-child(2){animation-delay:.04s}.slot:nth-child(3){animation-delay:.08s}.slot:nth-child(4){animation-delay:.12s}.slot:nth-child(5){animation-delay:.16s}}
@keyframes drop{from{transform:translateY(-4px);opacity:.4}to{transform:none;opacity:1}}
/* squad onboarding */
.stage{max-width:560px;margin:24px auto 0}
.stage .panel{gap:16px}
.lbl{font-weight:600;font-size:.9rem;display:block;margin-bottom:6px}
.join{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.invite{display:flex;gap:8px}
.invite input{flex:1;min-width:0;font:500 .82rem var(--mono);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
.steps b{color:var(--fg);font-weight:600}
.you{font:600 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);border-radius:4px;padding:2px 5px}
.pcard-head .pn{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere;padding:4px 6px}
.order{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.order .o{display:inline-flex;align-items:center;gap:4px;font:500 .78rem var(--mono);padding:3px 6px 3px 4px;border-radius:5px;background:var(--surface)}
.order .o .glyph{width:16px;height:16px}
.locked{font-size:.82rem;color:var(--muted)}
.grid.wide{margin-top:20px}
body{margin:0}
code{font-family:var(--mono);font-size:.9em}
.home-list{display:flex;flex-direction:column;gap:6px}
.home-list a{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;color:var(--fg);text-decoration:none;font-weight:600}
.home-list a:hover{border-color:var(--accent)}
footer.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font-size:.85rem;color:var(--muted)}
footer.foot a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script type="module">
const FB_VERSION='12.19.0';
const ROLES=['top','jungle','mid','bot','support'];
const RL={top:'Top',jungle:'Jungle',mid:'Mid',bot:'Bot',support:'Support'};
const PICK=['1st pick','2nd pick','3rd pick','4th pick','Last pick'];
const PREF=[0,1,2.5,4.5,7];      // cost of getting your Nth choice
const DEFAULT_CFG={wRep:1,wFair:1,wPerf:0.5,window:8};
const RECENT_KEY='fsq-recent-squads';
const PROFILE_KEY='fsq-profile';   // your name + last role order, so you only type them once per browser

const SID=new URLSearchParams(location.search).get('squad');
const emptyState=()=>({squad:null,players:{},games:{},live:{active:[],draft:null},cfg:{...DEFAULT_CFG}});
const S=emptyState();
let D=null;               // example squad, kept in memory only
let phase='connecting';   // connecting | ready | setup | error
let FB=null, UID=null, AUTH_USER=null, squadLoaded=false, squadMissing=false, pendingRender=false, toastMsg='';
function loadProfile(){try{const p=JSON.parse(localStorage.getItem(PROFILE_KEY)||'null');if(p&&p.name)return{name:cleanName(p.name),prefs:Array.isArray(p.prefs)&&p.prefs.length===5&&ROLES.every(r=>p.prefs.includes(r))?p.prefs:[...ROLES]}}catch(e){}return null}
function saveProfile(name,prefs){try{localStorage.setItem(PROFILE_KEY,JSON.stringify({name:cleanName(name),prefs:[...prefs]}))}catch(e){}PROFILE=loadProfile()||{name:cleanName(name),prefs:[...prefs]}}
const cleanName=n=>String(n||'').trim().slice(0,24);
let PROFILE=loadProfile();
const freshJoin=()=>({name:PROFILE?.name||'',prefs:[...(PROFILE?.prefs||ROLES)],avoid:[]});
const ui={swap:null,confirmDel:null,jn:freshJoin(),cn:{squad:'',name:PROFILE?.name||''},copied:false,editName:false};

const V=()=>D||S;
const me=()=>D?'ex0':UID;
const isCaptain=()=>!!D||(!!UID&&S.squad?.captain===UID);
const isMember=()=>!!D||(!!UID&&!!S.players[UID]);
const canEditPlayer=id=>!!D||id===UID||(isCaptain()&&id.startsWith('m-'));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pname=(st,id)=>st.players[id]?.name||'Someone';
const joinUrl=sid=>location.origin+location.pathname+'?squad='+sid;

// League position icons (shapes from the game client via CommunityDragon), tinted with the theme
function glyph(role){
  const dim='fill="currentColor" opacity=".4" fill-rule="evenodd"', on='fill="currentColor"';
  const p={
    top:`<path ${dim} d="M21,14H14v7h7V14Zm5-3V26L11.014,26l-4,4H30V7.016Z"/><polygon ${on} points="4 4 4.003 28.045 9 23 9 9 23 9 28.045 4.003 4 4"/>`,
    jungle:`<path ${on} fill-rule="evenodd" d="M25,3c-2.128,3.3-5.147,6.851-6.966,11.469A42.373,42.373,0,0,1,20,20a27.7,27.7,0,0,1,1-3C21,12.023,22.856,8.277,25,3ZM13,20c-1.488-4.487-4.76-6.966-9-9,3.868,3.136,4.422,7.52,5,12l3.743,3.312C14.215,27.917,16.527,30.451,17,31c4.555-9.445-3.366-20.8-8-28C11.67,9.573,13.717,13.342,13,20Zm8,5a15.271,15.271,0,0,1,0,2l4-4c0.578-4.48,1.132-8.864,5-12C24.712,13.537,22.134,18.854,21,25Z"/>`,
    mid:`<path ${dim} d="M30,12.968l-4.008,4L26,26H17l-4,4H30ZM16.979,8L21,4H4V20.977L8,17,8,8h8.981Z"/><polygon ${on} points="25 4 4 25 4 30 9 30 30 9 30 4 25 4"/>`,
    bot:`<path ${dim} d="M13,20h7V13H13v7ZM4,4V26.984l3.955-4L8,8,22.986,8l4-4H4Z"/><polygon ${on} points="29.997 5.955 25 11 25 25 11 25 5.955 29.997 30 30 29.997 5.955"/>`,
    support:`<path ${on} fill-rule="evenodd" d="M26,13c3.535,0,8-4,8-4H23l-3,3,2,7,5-2-3-4h2ZM22,5L20.827,3H13.062L12,5l5,6Zm-5,9-1-1L13,28l4,3,4-3L18,13ZM11,9H0s4.465,4,8,4h2L7,17l5,2,2-7Z"/>`
  }[role];
  return `<svg class="glyph" viewBox="0 0 34 34" aria-hidden="true">${p}</svg>`;
}

/* ---------- recent squads (this browser) ---------- */
function recentSquads(){try{return JSON.parse(localStorage.getItem(RECENT_KEY)||'[]')}catch(e){return[]}}
function rememberSquad(id,name){
  try{const l=recentSquads().filter(x=>x.id!==id);l.unshift({id,name});localStorage.setItem(RECENT_KEY,JSON.stringify(l.slice(0,8)))}catch(e){}
}

/* ---------- storage ---------- */
// paths: squad/main | players/<id> | games/<id> | live/draft  (all under squads/<SID>)
let chain=Promise.resolve();
function setLocal(st,path,data){
  const [c,id]=path.split('/');
  if(c==='players'){ if(data) st.players[id]=data; else delete st.players[id]; }
  else if(c==='games'){ if(data) st.games[id]=data; else delete st.games[id]; }
  else if(c==='live') st.live=data||{active:[],draft:null};
  else if(c==='squad'){ st.squad=data||null; st.cfg={...DEFAULT_CFG,...(data?.cfg||{})}; }
}
function fref(path){
  const [c,id]=path.split('/'), {doc,db}=FB;
  return c==='squad'?doc(db,'squads',SID):doc(db,'squads',SID,c,id);
}
function write(path,data){
  setLocal(V(),path,data); render();
  if(D||!FB||!SID) return;
  // one queue: later writes (like joining the draft) depend on earlier ones (joining the squad)
  chain=chain.then(()=>data?FB.setDoc(fref(path),data):FB.deleteDoc(fref(path))).catch(e=>{
    toastMsg=e?.code==='permission-denied'
      ?"That change wasn't saved: you can only edit your own roles. Ask the squad captain for anything else."
      :'Could not save: '+(e?.message||e);
    console.warn(e); render();
  });
}

/* ---------- the matchmaker ---------- */
function rankOf(p,role){const i=(p?.prefs||ROLES).indexOf(role);return i<0?4:i}
function sortedGames(st){return Object.entries(st.games).map(([id,g])=>({id,...g})).sort((a,b)=>b.at-a.at)}

function profile(st,pid){
  const p=st.players[pid], N=st.cfg.window|0||8;
  const all=sortedGames(st).filter(g=>g.lineup&&g.lineup[pid]);
  const h=all.slice(0,N);
  const rep={};ROLES.forEach(r=>rep[r]=0);
  let debt=0,wsum=0,lossOff=0;
  h.forEach((g,k)=>{
    const role=g.lineup[pid];
    rep[role]+=Math.pow(.6,k);
    const rk=g.picks?.[pid]??rankOf(p,role);
    let c=PREF[rk];
    if(g.result==='loss'&&rk>=2){c+=1.5; if(k<3) lossOff++;}
    const w=Math.pow(.8,k); debt+=c*w; wsum+=w;
  });
  debt=debt/(wsum+1);   // shrinks toward 0 when there is little history
  const perf={};ROLES.forEach(r=>perf[r]={w:0,l:0});
  all.forEach(g=>{const r=g.lineup[pid]; if(g.result==='win')perf[r].w++; else if(g.result==='loss')perf[r].l++;});
  return {debt,rep,perf,h,lossOff};
}
function cost(p,prof,role,cfg){
  const r=rankOf(p,role);
  const base=PREF[r];
  const fair=base*(1+cfg.wFair*prof.debt/3);
  const rep=cfg.wRep*prof.rep[role]*(2+PREF[r]);
  const pf=prof.perf[role], wr=(pf.w+1)/(pf.w+pf.l+2);
  const perf=-cfg.wPerf*(wr-.5)*6;
  return fair+rep+perf;
}
function solve(st,active){
  const ps=active.map(id=>({id,p:st.players[id],prof:profile(st,id)}));
  const C=ps.map(x=>Object.fromEntries(ROLES.map(r=>[r,cost(x.p,x.prof,r,st.cfg)])));
  const out=[],used=new Set(),cur=[];
  (function rec(i){
    if(i===ps.length){
      const cs=cur.map((r,j)=>C[j][r]);
      // total pain plus a bit extra for the single worst-off player
      const total=cs.reduce((a,b)=>a+b,0)+.5*Math.max(0,...cs)+Math.random()*.15;
      out.push({lineup:Object.fromEntries(ps.map((x,j)=>[x.id,cur[j]])),cost:total});return;
    }
    for(const r of ROLES){if(used.has(r))continue;used.add(r);cur[i]=r;rec(i+1);used.delete(r);}
  })(0);
  out.sort((a,b)=>a.cost-b.cost);
  const best=out[0].cost;
  return out.filter(o=>o.cost<=best+2.5).slice(0,6).map(o=>o.lineup);
}
function reasons(st,pid,role,lineup){
  const p=st.players[pid]; if(!p) return [];
  const prof=profile(st,pid), r=rankOf(p,role), out=[];
  const last=prof.h.slice(0,3), same=last.filter(g=>g.lineup[pid]===role).length;
  if(same) out.push([same>=2?'warn':'', `Played ${RL[role]} ${same} of last ${last.length}`]);
  if(r>0){
    const top=p.prefs[0], who=Object.keys(lineup).find(k=>lineup[k]===top);
    if(prof.rep[top]>=.9) out.push(['',`Rotated off ${RL[top]} after recent games`]);
    else if(who) out.push(['',`${RL[top]} went to ${pname(st,who)}`]);
  }
  if(prof.debt>=2) out.push(['good','Priority: owed after off-role games']);
  if(prof.lossOff) out.push(['',`Lost ${prof.lossOff} recent game${prof.lossOff>1?'s':''} on an off-role`]);
  const pf=prof.perf[role]; if(pf.w+pf.l>=2) out.push(['',`${pf.w}W ${pf.l}L on ${RL[role]}`]);
  return out;
}

/* ---------- actions ---------- */
function activeIds(st){return (st.live.active||[]).filter(id=>st.players[id])}
function roll(){
  const st=V(),act=activeIds(st); if(!act.length) return;
  const alts=solve(st,act); ui.swap=null;
  write('live/draft',{...st.live,draft:{lineup:alts[0],alts,idx:0,at:Date.now(),edited:false}});
}
function reroll(){
  const st=V(),d=st.live.draft; if(!d||d.alts.length<2) return;
  const idx=(d.idx+1)%d.alts.length; ui.swap=null;
  write('live/draft',{...st.live,draft:{...d,idx,lineup:d.alts[idx],edited:false}});
}
function swapPick(pid){
  const st=V(),d=st.live.draft; if(!d) return;
  if(!ui.swap||ui.swap===pid){ui.swap=ui.swap?null:pid;render();return;}
  const a=ui.swap,lu={...d.lineup};[lu[a],lu[pid]]=[lu[pid],lu[a]];ui.swap=null;
  write('live/draft',{...st.live,draft:{...d,lineup:lu,edited:true}});
}
function lockIn(){
  const st=V(),d=st.live.draft; if(!d) return;
  const picks={};Object.entries(d.lineup).forEach(([pid,r])=>picks[pid]=rankOf(st.players[pid],r));
  write('games/'+uid(),{at:Date.now(),lineup:{...d.lineup},picks,result:null});
  write('live/draft',{...st.live,draft:null});
}
function toggleActive(pid){
  const st=V(); let a=activeIds(st);
  if(a.includes(pid)) a=a.filter(x=>x!==pid); else { if(a.length>=5) return; a=[...a,pid]; }
  write('live/draft',{...st.live,active:a});
}
function savePlayer(pid,patch){
  const p=V().players[pid];
  // avoid stays an empty list: refusing roles was removed, but the published Firestore rules still expect the field
  const next={...p,prefs:[...p.prefs],avoid:[],...patch};
  write('players/'+pid,next);
  if(pid===me()&&!D) saveProfile(next.name,next.prefs);
}
function movePref(pid,i,dir){
  const j=i+dir; if(j<0||j>4) return;
  const src=pid==='@join'?ui.jn:V().players[pid], prefs=[...src.prefs];
  [prefs[i],prefs[j]]=[prefs[j],prefs[i]];
  if(pid==='@join'){ui.jn.prefs=prefs;render()} else savePlayer(pid,{prefs});
}
// names are only labels (players are keyed by id), but two "Alex"es would be impossible to tell apart
const nameKey=n=>cleanName(n).toLowerCase().replace(/\s+/g,' ');
function nameTaken(name,exceptId){
  const k=nameKey(name);
  const hit=Object.entries(V().players).some(([id,p])=>id!==exceptId&&nameKey(p.name)===k);
  if(hit){toastMsg=`"${cleanName(name)}" is already in this squad. Pick a different name.`;render()}
  return hit;
}
function rename(pid,name){
  const p=V().players[pid]; name=cleanName(name); if(!p||!name||name===p.name) return;
  if(nameTaken(name,pid)) return;
  savePlayer(pid,{name});
}
function joinSquad(){
  const name=cleanName(ui.jn.name), id=me(); if(!name||!id) return;
  if(nameTaken(name,id)){ui.editName=true;render();return}
  const st=V();
  write('players/'+id,{name,prefs:[...ui.jn.prefs],avoid:[],created:Date.now()});
  const a=activeIds(st); if(a.length<5&&!a.includes(id)) write('live/draft',{...st.live,active:[...a,id]});
  if(!D) saveProfile(name,ui.jn.prefs);
  ui.editName=false; ui.jn=freshJoin();
}
// e.g. "Oct 8, 9:41 PM Flex"
const defaultSquadName=()=>cleanName(new Date().toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' Flex');
async function createSquad(){
  const name=cleanName(ui.cn.name); if(!name||!FB||!UID) return;
  saveProfile(name,ui.jn.prefs);
  const sq=cleanName(ui.cn.squad)||defaultSquadName();
  const sid=Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');
  const {doc,db,setDoc}=FB;
  try{
    await setDoc(doc(db,'squads',sid),{name:sq,captain:UID,created:Date.now(),cfg:{...DEFAULT_CFG}});
    await setDoc(doc(db,'squads',sid,'players',UID),{name,prefs:[...ui.jn.prefs],avoid:[],created:Date.now()});
    await setDoc(doc(db,'squads',sid,'live','draft'),{active:[UID],draft:null});
    rememberSquad(sid,sq);
    location.href=joinUrl(sid);
  }catch(e){toastMsg='Could not create the squad: '+(e?.message||e);render()}
}
function addManual(name){
  name=cleanName(name); if(!name||nameTaken(name)) return;
  write('players/m-'+uid(),{name,prefs:[...ROLES],avoid:[],created:Date.now(),manual:true});
}
async function deleteSquad(){
  if(!FB||!SID||!isCaptain()) return;
  ui.deleting=true; render();
  const {db,doc,collection,getDocs,writeBatch}=FB;
  try{
    const [games,players]=await Promise.all([getDocs(collection(db,'squads',SID,'games')),getDocs(collection(db,'squads',SID,'players'))]);
    // order matters: the captain's own entry and the squad go last, because the rules check them
    const refs=[doc(db,'squads',SID,'live','draft'),...games.docs.map(d=>d.ref),
      ...players.docs.filter(d=>d.id!==UID).map(d=>d.ref),doc(db,'squads',SID,'players',UID),doc(db,'squads',SID)];
    for(let i=0;i<refs.length;i+=450){const b=writeBatch(db);refs.slice(i,i+450).forEach(r=>b.delete(r));await b.commit()}
    try{localStorage.setItem(RECENT_KEY,JSON.stringify(recentSquads().filter(x=>x.id!==SID)))}catch(e){}
    location.href=location.pathname;
  }catch(e){
    ui.deleting=false; ui.confirmDel=null;
    toastMsg=e?.code==='permission-denied'
      ?'Firebase refused the delete. Paste the latest firestore.rules into Firestore → Rules and publish, then try again.'
      :'Could not delete the squad: '+(e?.message||e);
    render();
  }
}
function removePlayer(pid){
  const st=V();
  if((st.live.active||[]).includes(pid)) write('live/draft',{...st.live,active:activeIds(st).filter(x=>x!==pid),draft:null});
  write('players/'+pid,null);
  ui.confirmDel=null;
}
function setResult(gid,res){
  const g=V().games[gid]; if(!g) return;
  write('games/'+gid,{...g,lineup:{...g.lineup},picks:{...(g.picks||{})},result:g.result===res?null:res});
}
function deleteGame(gid){write('games/'+gid,null);ui.confirmDel=null}
function setCfg(k,v){const st=V();write('squad/main',{...st.squad,cfg:{...st.cfg,[k]:v}})}
async function copyLink(){
  const url=joinUrl(SID);
  try{await navigator.clipboard.writeText(url);ui.copied=true;render();setTimeout(()=>{ui.copied=false;render()},1800)}
  catch(e){const i=document.getElementById('invite-url');if(i){i.focus();i.select()}}
}
async function linkGoogle(){
  if(!FB) return;
  const {auth,GoogleAuthProvider,linkWithPopup,signInWithCredential}=FB;
  const prov=new GoogleAuthProvider();
  try{
    await linkWithPopup(auth.currentUser,prov);
    toastMsg='Linked to Google. Sign in with Google on your other devices to be the same player.';
  }catch(e){
    if(e?.code==='auth/credential-already-in-use'){
      // this Google account already belongs to a player: switch to it
      const cred=GoogleAuthProvider.credentialFromError(e);
      try{await signInWithCredential(auth,cred);toastMsg='Signed in with Google.'}catch(e2){toastMsg='Google sign-in failed: '+(e2?.message||e2)}
    }else if(e?.code==='auth/operation-not-allowed') toastMsg='Google sign-in is not turned on for this site yet. The captain can enable it in Firebase (see the setup guide).';
    else if(e?.code!=='auth/popup-closed-by-user') toastMsg='Google sign-in failed: '+(e?.message||e);
  }
  render();
}

    const ctl=ui.confirmDel==='g'+g.id?`<span class="confirm">Delete this game? <button class="btn sm loss" data-act="delGame" data-id="${g.id}">Delete</button><button class="btn sm ghost" data-act="cancelDel">Keep</button></span>`
      :`<span class="row"><button class="btn sm win ${g.result==='win'?'sel':''}" data-act="res" data-id="${g.id}" data-v="win" ${play?'':'disabled'}>W</button><button class="btn sm loss ${g.result==='loss'?'sel':''}" data-act="res" data-id="${g.id}" data-v="loss" ${play?'':'disabled'}>L</button>${cap?`<button class="icon-btn" data-act="askDelGame" data-id="${g.id}" title="Delete game" aria-label="Delete game">✕</button>`:''}</span>`;
    return `<div class="game ${g.result?'':'pending'}"><span class="when">${g.result?ago(g.at):'In progress'}</span><div class="lu">${lu}</div>${ctl}</div>`;
  }).join('')}</div>`;
  gp+=`</section>`;

  /* heatmap */
  let hm='';
  if(ids.length&&games.length){
    const recent=games.slice(0,20);
    const rows=ids.map(id=>{
      const cnt={};ROLES.forEach(r=>cnt[r]=0);let n=0,rs=0,w=0,l=0;
      recent.forEach(g=>{const r=g.lineup[id];if(!r)return;cnt[r]++;n++;rs+=(g.picks?.[id]??rankOf(st.players[id],r))+1;if(g.result==='win')w++;if(g.result==='loss')l++;});
      return {id,cnt,avg:n?rs/n:null,w,l};
    });
    const max=Math.max(1,...rows.flatMap(r=>ROLES.map(x=>r.cnt[x])));
    hm=`<section class="panel" id="history"><div class="panel-head"><h2>Who played what</h2><span class="eyebrow">Last ${Math.min(20,games.length)} games</span></div>
      <div class="tablewrap"><table class="heat"><thead><tr><th></th>${ROLES.map(r=>`<th title="${RL[r]}">${RL[r].slice(0,3)}</th>`).join('')}<th title="Average pick number they got (1 = first choice)">Avg pick</th><th>W–L</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><th class="pl">${esc(pname(st,r.id))}</th>${ROLES.map(x=>{const v=r.cnt[x],pct=Math.round(v/max*70),pref=rankOf(st.players[r.id],x);
        return `<td style="background:color-mix(in srgb,var(${pref>=3?'--bad':'--accent'}) ${pct}%,var(--surface-2));color:${pct>45?'var(--surface)':'var(--fg)'}" title="${esc(pname(st,r.id))}: ${v} on ${RL[x]} (${PICK[pref]})">${v||'·'}</td>`}).join('')}
        <td class="stat">${r.avg?r.avg.toFixed(1):'–'}</td><td class="stat">${r.w}–${r.l}</td></tr>`).join('')}
      </tbody></table></div><p class="note" style="margin:0">Red cells are roles that person ranked 4th or last. A fair rotation keeps the avg pick close across the squad.</p></section>`;
  }

  /* invite (captain only) */
  const inv=cap&&!D?`<section class="panel"><div class="panel-head"><h2>Invite your squad</h2></div>
    <div class="invite"><input type="text" id="invite-url" readonly value="${esc(joinUrl(SID))}" aria-label="Join link"><button class="btn" data-act="copy">${ui.copied?'Copied':'Copy link'}</button></div>
    <p class="note" style="margin:0">Anyone with this link can join and rank their own roles. They can't change other players or the settings.</p></section>`:'';

  /* my card */
  let mine='';
  if(joined){
    const p=st.players[myId];
    mine=`<section class="panel"><div class="panel-head"><h2>Your roles</h2><span class="you">You</span></div>
      <div class="pcard-head">${av(p.name)}<input type="text" id="my-name" value="${esc(p.name)}" data-act="rename" data-id="${myId}" aria-label="Your name" maxlength="24"></div>
      ${prefEditor(myId,p.prefs)}${owedMeter(st,myId)}
      ${ui.confirmDel==='p'+myId?`<div class="confirm">Leave the squad? Your past games stay in the log. <button class="btn sm loss" data-act="delPlayer" data-id="${myId}">Leave</button><button class="btn sm ghost" data-act="cancelDel">Stay</button></div>`:(cap?'':`<button class="btn sm ghost" style="align-self:flex-start" data-act="askDelPlayer" data-id="${myId}">Leave squad</button>`)}</section>`;
  }

  /* squad list */
  const others=ids.filter(id=>id!==myId);
  let sq=`<section class="panel" id="squad"><div class="panel-head"><h2>Squad</h2><span class="eyebrow">${ids.length} players</span></div>`;
  if(!others.length) sq+=`<div class="empty">${cap?'Nobody else yet. Send the join link to your friends.':'Nobody else has joined yet.'}</div>`;
  sq+=`<div class="players">${others.map(id=>{
    const p=st.players[id], edit=canEditPlayer(id);
    const del=ui.confirmDel==='p'+id?`<div class="confirm">Remove ${esc(p.name)}? Their past games stay in the log. <button class="btn sm loss" data-act="delPlayer" data-id="${id}">Remove</button><button class="btn sm ghost" data-act="cancelDel">Keep</button></div>`:'';
    const head=edit?`<input type="text" id="name-${id}" value="${esc(p.name)}" data-act="rename" data-id="${id}" aria-label="Player name" maxlength="24">`:`<span class="pn">${esc(p.name)}</span>`;
    return `<div class="pcard"><div class="pcard-head">${av(p.name)}${head}${p.manual?'<span class="tag" title="Added by the captain">Added</span>':''}
      ${cap?`<button class="icon-btn" data-act="askDelPlayer" data-id="${id}" title="Remove player" aria-label="Remove ${esc(p.name)}">✕</button>`:''}</div>
      ${edit?prefEditor(id,p.prefs):prefSummary(p)}${owedMeter(st,id)}${del}</div>`;
  }).join('')}</div>`;
  if(cap) sq+=`<form class="add" data-act="addManual"><input type="text" id="new-player" placeholder="Add someone by name" maxlength="24" aria-label="Player name"><button class="btn" type="submit">Add</button></form>`;
  sq+=`</section>`;

  /* tuning */
  const c=st.cfg;
  const sl=(k,label,min,max,step,help)=>`<div class="slider"><label for="cfg-${k}">${label}<span class="muted">${c[k]}</span></label><input type="range" id="cfg-${k}" min="${min}" max="${max}" step="${step}" value="${c[k]}" data-act="cfg" data-k="${k}" ${cap?'':'disabled'}><p>${help}</p></div>`;
  const tune=`<section class="panel"><details class="tune"><summary>Draft settings</summary><div class="sliders">
    ${cap?'':'<p class="locked" style="margin:0">Only the squad captain can change these.</p>'}
    ${sl('wRep','Rotation strength',0,3,.25,'How hard the draft pushes people off a role they just played.')}
    ${sl('wFair','Fairness priority',0,3,.25,'How much extra say people get after a run of bad picks.')}
    ${sl('wPerf','Lean on results',0,2,.25,'Nudges people toward roles they win on, away from roles they keep losing on.')}
    ${sl('window','Memory (games)',3,20,1,'How many recent games count for rotation and fairness.')}
    ${cap?'<button class="btn sm ghost" data-act="resetCfg" style="justify-self:start">Reset to defaults</button>':''}</div></details></section>`;

  /* delete squad (captain only) */
  const danger=cap&&!D?`<section class="panel danger"><div class="panel-head"><h2>Delete squad</h2></div>
    ${ui.deleting?'<p class="muted" style="margin:0">Deleting…</p>':ui.confirmDel==='squad'
      ?`<p style="margin:0">This permanently deletes <b>${esc(st.squad.name)}</b> for everyone: all players, role rankings and game history. It can't be undone.</p>
        <div class="row"><button class="btn loss sel" data-act="delSquad">Delete forever</button><button class="btn ghost" data-act="cancelDel">Cancel</button></div>`
      :`<p class="note" style="margin:0">Removes the squad and its game history for everyone. The join link stops working.</p>
        <button class="btn sm loss" style="align-self:flex-start" data-act="askDelSquad">Delete squad…</button>`}</section>`:'';

  app.innerHTML=h+(join?`<div class="stage" style="margin:0 auto 4px">${join}</div>`:'')+
    `<div class="grid ${join?'wide':''}"><div class="col">${draft}${gp}${hm}</div><div class="col">${inv}${mine}${sq}${tune}${danger}</div></div>`+footer();
}

/* ---------- events ---------- */
const app=document.getElementById('app');
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.tagName==='FORM'||b.tagName==='INPUT') return;
  const id=b.dataset.id;
  switch(b.dataset.act){
    case 'active':toggleActive(id);break;
    case 'roll':roll();break;
    case 'reroll':reroll();break;
    case 'swap':swapPick(id);break;
    case 'lock':lockIn();break;
    case 'res':setResult(id,b.dataset.v);break;
    case 'askDelGame':ui.confirmDel='g'+id;render();break;
    case 'delGame':deleteGame(id);break;
    case 'askDelPlayer':ui.confirmDel='p'+id;render();break;
    case 'delPlayer':removePlayer(id);break;
    case 'cancelDel':ui.confirmDel=null;render();break;
    case 'up':movePref(id,+b.dataset.i,-1);break;
    case 'down':movePref(id,+b.dataset.i,1);break;
    case 'resetCfg':write('squad/main',{...V().squad,cfg:{...DEFAULT_CFG}});break;
    case 'copy':copyLink();break;
    case 'editName':ui.editName=true;render();setTimeout(()=>document.getElementById('jn-name')?.focus()||document.getElementById('cn-name')?.focus(),0);break;
    case 'askDelSquad':ui.confirmDel='squad';render();break;
    case 'delSquad':deleteSquad();break;
    case 'google':linkGoogle();break;
    case 'dismiss':toastMsg='';render();break;
    case 'demo':startDemo();break;
    case 'exitDemo':D=null;ui.swap=null;render();break;
  }
});
app.addEventListener('submit',e=>{
  e.preventDefault(); const f=e.target, kind=f.dataset.act;
  document.activeElement?.blur?.();
  if(kind==='create') createSquad();
  else if(kind==='join') joinSquad();
  else if(kind==='addManual'){const i=f.querySelector('input');const v=i.value;i.value='';addManual(v)}
  render();
});
app.addEventListener('input',e=>{
  const b=e.target.dataset.bind; if(!b) return; const [o,k]=b.split('.'); ui[o][k]=e.target.value;
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='rename') rename(t.dataset.id,t.value);
  if(t.dataset.act==='cfg') setCfg(t.dataset.k,+t.value);
});
app.addEventListener('keydown',e=>{if(e.target.dataset?.act==='rename'&&e.key==='Enter')e.target.blur()});
app.addEventListener('focusout',()=>{setTimeout(()=>{if(pendingRender)render()},0)});

/* ---------- drag the role bubbles ---------- */
const calm=matchMedia('(prefers-reduced-motion: reduce)');
let drag=null;
function renumber(ol){[...ol.children].forEach((x,i)=>{const k=x.querySelector('.rk');k.textContent=i+1;k.className='rk r'+i})}
function flip(ol,moveFn){
  // animate the other bubbles from where they were to where they land
  const before=new Map([...ol.children].map(x=>[x,x.getBoundingClientRect()]));
  moveFn();
  if(calm.matches) return;
  for(const x of ol.children){
    if(drag&&x===drag.li) continue;
    const a=before.get(x),b=x.getBoundingClientRect(),dx=a.left-b.left,dy=a.top-b.top;
    if(dx||dy) x.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:200,easing:'cubic-bezier(.2,.8,.2,1)'});
  }
}
function follow(e){
  const {li}=drag; li.style.transform='';
  const r=li.getBoundingClientRect();
  li.style.transform=`translateY(${e.clientY-drag.gy-r.top}px)`;
}
app.addEventListener('pointerdown',e=>{
  const li=e.target.closest('.bubbles .bubble'); if(!li||e.button>0||e.target.closest('button')) return;
  const ol=li.parentElement, r=li.getBoundingClientRect();
  drag={li,ol,key:ol.dataset.key,id:e.pointerId,sx:e.clientX,sy:e.clientY,gx:e.clientX-r.left,gy:e.clientY-r.top,live:false};
  ol.setPointerCapture(e.pointerId);
  e.preventDefault();
});
app.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id) return;
  const {li,ol}=drag;
  if(!drag.live){ if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<4) return; drag.live=true; li.classList.add('lifted'); }
  follow(e);
  // nearest other bubble, by its resting position
  let best=null,bd=Infinity;
  for(const x of ol.children){ if(x===li) continue;
    const c={x:x.offsetLeft+x.offsetWidth/2,y:x.offsetTop+x.offsetHeight/2}, o=ol.getBoundingClientRect();
    const d=Math.hypot(e.clientX-o.left-c.x,e.clientY-o.top-c.y); if(d<bd){bd=d;best=x} }
  if(!best||bd>best.offsetWidth+best.offsetHeight) return;
  const after=e.clientY-ol.getBoundingClientRect().top>best.offsetTop+best.offsetHeight/2;
  const ref=after?best.nextElementSibling:best;
  if(ref===li||ref===li.nextElementSibling) return;
  flip(ol,()=>{ol.insertBefore(li,ref);renumber(ol)});
  follow(e);
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id) return;
  const {li,ol,key,live}=drag; drag=null;
  if(!live){ if(pendingRender) render(); else li.focus(); return; }
  const from=li.style.transform; li.style.transform=''; li.classList.remove('lifted');
  if(from&&!calm.matches) li.animate([{transform:from},{transform:'none'}],{duration:180,easing:'cubic-bezier(.2,.8,.2,1)'});
  const order=[...ol.children].map(x=>x.dataset.r);
  setTimeout(()=>commitOrder(key,order),calm.matches?0:190);
}
function commitOrder(key,order){
  const cur=key==='@join'?ui.jn.prefs:V().players[key]?.prefs;
  if(!cur||order.join()===cur.join()){render();return}
  if(key==='@join'){ui.jn.prefs=order;render()} else savePlayer(key,{prefs:order});
}
app.addEventListener('pointerup',endDrag);
app.addEventListener('pointercancel',endDrag);
// keyboard: arrows move the focused bubble
app.addEventListener('keydown',e=>{
  const li=e.target.closest?.('.bubbles .bubble'); if(!li||e.target!==li) return;
  const dir={ArrowLeft:-1,ArrowUp:-1,ArrowRight:1,ArrowDown:1}[e.key]; if(!dir) return;
  e.preventDefault();
  const ol=li.parentElement,key=ol.dataset.key,r=li.dataset.r,order=[...ol.children].map(x=>x.dataset.r),i=order.indexOf(r),j=i+dir;
  if(j<0||j>4) return;
  [order[i],order[j]]=[order[j],order[i]];
  commitOrder(key,order);
  document.querySelector(`.bubbles[data-key="${key}"] .bubble[data-r="${r}"]`)?.focus();
});

/* ---------- boot ---------- */
render();
let firebaseConfig=null;
try{({firebaseConfig}=await import('./firebase-config.js'))}catch(e){}
if(!firebaseConfig||!firebaseConfig.apiKey||firebaseConfig.apiKey.startsWith('PASTE')){phase='setup';render()}
else{
  try{
    const base=`https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
    const [fa,fauth,fs]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    const fbApp=fa.initializeApp(firebaseConfig);
    const auth=fauth.getAuth(fbApp), db=fs.getFirestore(fbApp);
    FB={auth,db,doc:fs.doc,setDoc:fs.setDoc,deleteDoc:fs.deleteDoc,collection:fs.collection,getDocs:fs.getDocs,writeBatch:fs.writeBatch,
        GoogleAuthProvider:fauth.GoogleAuthProvider,linkWithPopup:fauth.linkWithPopup,signInWithCredential:fauth.signInWithCredential};
    let subscribed=false;
    fauth.onAuthStateChanged(auth,user=>{
      if(!user){fauth.signInAnonymously(auth).catch(e=>{phase='error';toastMsg=e?.code==='auth/admin-restricted-operation'||e?.code==='auth/operation-not-allowed'?'Anonymous sign-in is turned off in Firebase. Turn it on under Authentication → Sign-in method.':'Sign-in failed: '+(e?.message||e);render()});return}
      AUTH_USER=user; UID=user.uid; phase='ready'; render();
      if(SID&&!subscribed){subscribed=true;subscribe(fs,db)}
    });
  }catch(e){phase='error';toastMsg='Could not load Firebase: '+(e?.message||e);render()}
}

function subscribe(fs,db){
  const {doc,collection,onSnapshot,query,orderBy,limit}=fs;
  const err=e=>{console.warn(e);toastMsg='Lost connection to the squad: '+(e?.message||e);render()};
  onSnapshot(doc(db,'squads',SID),s=>{
    squadLoaded=true; squadMissing=!s.exists();
    setLocal(S,'squad/main',s.exists()?s.data():null);
    if(s.exists()) rememberSquad(SID,s.data().name);
    render();
    if(s.exists()&&!S.players[UID]) setTimeout(()=>{const el=document.getElementById('jn-name');if(el&&!el.value)el.focus()},60);
  },err);
  onSnapshot(collection(db,'squads',SID,'players'),s=>{S.players={};s.forEach(d=>S.players[d.id]=d.data());render()},err);
  onSnapshot(query(collection(db,'squads',SID,'games'),orderBy('at','desc'),limit(300)),s=>{S.games={};s.forEach(d=>S.games[d.id]=d.data());render()},err);
  onSnapshot(doc(db,'squads',SID,'live','draft'),s=>{S.live=s.exists()?s.data():{active:[],draft:null};render()},err);
}
</script>
